# Mr. Version Configuration Example
# This file demonstrates how to configure version behavior for your monorepo

# Base global version used as fallback when no tags or versions are found
# Applies to all projects including test projects and artifacts normally ignored
baseVersion: "3.0.0"

# Global settings that apply to all projects
prereleaseType: none  # Options: none, alpha, beta, rc
tagPrefix: v         # Prefix for version tags (default: v)
skipTestProjects: true
skipNonPackableProjects: true

# ✨ NEW: Version scheme selection (SemVer or CalVer). "versionScheme" and "scheme" are equivalent.
versionScheme: semver  # Options: semver (default), calver

# ✨ NEW: Calendar Versioning (CalVer) configuration
calver:
  format: "YYYY.MM.PATCH"  # Options: YYYY.MM.PATCH, YY.0M.PATCH, YYYY.WW.PATCH, YYYY.0M.PATCH
  resetPatchPeriodically: true  # Reset patch to 0 each month/week
  separator: "."  # Version separator
  startDate: "2025-01-01"  # Optional: Starting date for versioning

# ✨ NEW: Version policies for coordinating releases
#   Independent: every project has its own version (default)
#   LockStep:    every project gets the highest version in the repository
#   Grouped:     projects in a LockStep group share the group's highest version (or the group's baseVersion if higher)
versionPolicy:
  policy: Grouped
  groups:
    core-libraries:
      projects: [Mister.Version.Core, Mister.Version]   # names or wildcards, e.g. "Contoso.*"
      strategy: LockStep
    tools:
      projects: [Mister.Version.CLI]
      strategy: Independent

# ✨ NEW: Conventional commits configuration for semantic versioning
commitConventions:
  enabled: true
  majorPatterns:
    - "BREAKING CHANGE:"
    - "!:"
    - "breaking:"
  minorPatterns:
    - "feat:"
    - "feature:"
  patchPatterns:
    - "fix:"
    - "bugfix:"
    - "perf:"
    - "refactor:"
  ignorePatterns:
    - "chore:"
    - "docs:"
    - "style:"
    - "test:"
    - "ci:"

# ✨ NEW: File pattern-based change detection
changeDetection:
  enabled: true

  # Ignore patterns (won't trigger version bumps)
  ignorePatterns:
    - "**/*.md"           # All markdown files
    - "**/docs/**"        # Documentation folder
    - "**/*.txt"          # Text files
    - "**/.editorconfig"  # Editor config
    - "**/.gitignore"     # Git ignore files

  # Major version patterns (breaking changes)
  majorPatterns:
    - "**/PublicApi/**"   # Public API folder
    - "**/Contracts/**"   # Contract definitions
    - "**/Interfaces/**"  # Public interfaces

  # Minor version patterns (new features)
  minorPatterns:
    - "**/Features/**"    # New features

  # Patch version patterns (bug fixes)
  patchPatterns:
    - "**/Internal/**"    # Internal code
    - "**/Utils/**"       # Utility code

  # Source-only mode
  sourceOnlyMode: false

# ✨ NEW: Git integration configuration
gitIntegration:
  # Shallow clone support
  shallowCloneSupport: true
  shallowCloneFallbackVersion: "1.0.0"

  # Submodule detection
  submoduleSupport: true

  # Tag ancestry validation
  validateTagAncestry: true

  # Branch metadata in versions
  includeBranchInMetadata: true

  # Custom tag patterns: "ProjectName={format}" ("*" for all projects); {name}, {prefix} and {version} are replaced
  customTagPatterns:
    - "MyLib={name}_{prefix}{version}"
    - "MyApp={name}/{prefix}{version}"

# ✨ NEW: Changelog generation configuration
changelog:
  enabled: true
  outputFormat: markdown  # Options: markdown, text, json
  outputPath: CHANGELOG.md
  repositoryUrl: https://github.com/mr-version/mister.version
  includeCommitLinks: true
  includeIssueReferences: true
  includePullRequestReferences: true
  includeAuthors: false
  groupBreakingChanges: true
  includeScopes: true
  sections:
    - title: "Breaking Changes"
      emoji: "💥"
      commitTypes: ["breaking"]
      order: 1
    - title: "Features"
      emoji: "🚀"
      commitTypes: ["feat", "feature"]
      order: 2
    - title: "Bug Fixes"
      emoji: "🐛"
      commitTypes: ["fix", "bugfix"]
      order: 3
    - title: "Performance"
      emoji: "⚡"
      commitTypes: ["perf"]
      order: 4
    - title: "Documentation"
      emoji: "📝"
      commitTypes: ["docs"]
      order: 5

# ✨ NEW: Version validation constraints. A violation fails the build (MSBuild error MRV004).
constraints:
  enabled: false                   # set to true to enforce
  minimumVersion: "1.0.0"          # Never go below this version
  maximumVersion: "10.0.0"         # Never exceed this version
  allowedRange: "3.x.x"            # Stay within version range
  requireMonotonicIncrease: true   # Versions must always increase
  blockedVersions: []              # Versions that must never be produced
  requireMajorApproval: false      # Major bumps need MonoRepoMajorVersionApproved=true
  validateDependencyVersions: true # Validate dependency compatibility

# Project-specific overrides
projects:
  # Example: Force a specific project to use alpha prereleases
  MyLibrary:
    prereleaseType: alpha

  # Example: Pin a specific project to a fixed version
  LegacyProject:
    forceVersion: 1.0.0

  # Example: Project that should use beta prereleases
  ExperimentalFeature:
    prereleaseType: beta

  # ✨ NEW: Project using CalVer instead of SemVer
  MyOperatingSystem:
    versionScheme: calver
    calver:
      format: "YY.0M.PATCH"
      resetPatchPeriodically: true

  # ✨ NEW: Project with additional directory monitoring
  MyApi:
    additionalMonitorPaths:
      - "../shared/common"
      - "../libs/authentication"

  # Note: per-project overrides support prereleaseType, forceVersion, additionalMonitorPaths,
  # versionScheme/scheme and calver; constraints are global.