name: Comprehensive Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# SDK legs: every job pins the SDK named by its matrix leg by merging an "sdk" entry into the
# repository's global.json (keeping its "test": {"runner": "Microsoft.Testing.Platform"} section).
# Without the pin, setup-dotnet installs the requested SDK but the newest SDK on the runner builds
# every leg, so the 8.0.x/9.0.x/10.0.x legs were all the same build.
#
# The solution needs the .NET 10 SDK: the tests target net10.0, global.json selects the
# Microsoft.Testing.Platform runner, and Mister.Version.Core also targets net9.0/net10.0
# (an older SDK fails with NETSDK1045 already at restore). Therefore:
#   - unit tests, CodeQL and the performance test run on 10.0.x only;
#   - the integration tests also run on the 8.0.x and 9.0.x SDKs, building what those SDKs can: the
#     CLI and the MSBuild task for net8.0 (the target framework of the shipped CLI and of the
#     dotnet-hosted task), then the full CLI scenario suite against that CLI.

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Pin .NET SDK ${{ matrix.dotnet-version }}
      run: |
        want="${{ matrix.dotnet-version }}"
        want="${want%.x}"
        sdk=$(dotnet --list-sdks | awk -v p="$want." 'index($1, p) == 1 { print $1 }' | sort -V | tail -n 1)
        if [ -z "$sdk" ]; then
          echo "::error::No .NET SDK $want.x is installed"
          exit 1
        fi
        jq --arg v "$sdk" '.sdk = {version: $v, rollForward: "latestFeature"}' global.json > "$RUNNER_TEMP/global.json"
        mv "$RUNNER_TEMP/global.json" global.json
        cat global.json
        actual=$(dotnet --version)
        echo "dotnet --version: $actual"
        case "$actual" in
          "$want".*) ;;
          *) echo "::error::Expected .NET SDK $want.x but dotnet resolved $actual"; exit 1 ;;
        esac

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Run Unit Tests
      run: dotnet test --no-build --verbosity normal --report-trx --coverage --coverage-output ./coverage --coverage-output-format cobertura

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-dotnet-${{ matrix.dotnet-version }}
        path: "**/*.trx"

    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-dotnet-${{ matrix.dotnet-version }}
        path: "**/coverage.cobertura.xml"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Pin .NET SDK ${{ matrix.dotnet-version }}
      run: |
        want="${{ matrix.dotnet-version }}"
        want="${want%.x}"
        sdk=$(dotnet --list-sdks | awk -v p="$want." 'index($1, p) == 1 { print $1 }' | sort -V | tail -n 1)
        if [ -z "$sdk" ]; then
          echo "::error::No .NET SDK $want.x is installed"
          exit 1
        fi
        jq --arg v "$sdk" '.sdk = {version: $v, rollForward: "latestFeature"}' global.json > "$RUNNER_TEMP/global.json"
        mv "$RUNNER_TEMP/global.json" global.json
        cat global.json
        actual=$(dotnet --version)
        echo "dotnet --version: $actual"
        case "$actual" in
          "$want".*) ;;
          *) echo "::error::Expected .NET SDK $want.x but dotnet resolved $actual"; exit 1 ;;
        esac

    # Applies to every MSBuild invocation under the repository, including the build done by
    # test-versioning-scenarios.sh, so the whole leg uses only what this SDK can build.
    - name: Restrict build to net8.0 (SDK older than 10)
      if: matrix.dotnet-version != '10.0.x'
      run: echo '-p:TargetFrameworks=net8.0' > Directory.Build.rsp

    - name: Restore and Build (solution)
      if: matrix.dotnet-version == '10.0.x'
      run: |
        dotnet restore
        dotnet build --no-restore

    - name: Build CLI and MSBuild task (net8.0)
      if: matrix.dotnet-version != '10.0.x'
      run: |
        dotnet build ./Mister.Version.CLI/Mister.Version.CLI.csproj
        dotnet build ./Mister.Version/Mister.Version.csproj

    - name: Make scripts executable
      run: chmod +x ./test-versioning-scenarios.sh

    - name: Run Integration Tests
      run: |
        export USE_DOTNET=true
        ./test-versioning-scenarios.sh

    - name: Upload Integration Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results-dotnet-${{ matrix.dotnet-version }}
        path: "${{ runner.temp }}/test-results.txt"

  # The former "regression-tests" job (6 scenarios x 3 SDKs) only echoed text. Its scenarios (basic
  # versioning, monorepo dependencies, prerelease progression, global vs project tags, new release
  # cycles, config baseVersion) are all part of the scenario suite run by integration-tests above and of
  # the unit tests, so the job was removed.

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Pin .NET SDK ${{ matrix.dotnet-version }}
      run: |
        want="${{ matrix.dotnet-version }}"
        want="${want%.x}"
        sdk=$(dotnet --list-sdks | awk -v p="$want." 'index($1, p) == 1 { print $1 }' | sort -V | tail -n 1)
        if [ -z "$sdk" ]; then
          echo "::error::No .NET SDK $want.x is installed"
          exit 1
        fi
        jq --arg v "$sdk" '.sdk = {version: $v, rollForward: "latestFeature"}' global.json > "$RUNNER_TEMP/global.json"
        mv "$RUNNER_TEMP/global.json" global.json
        cat global.json
        actual=$(dotnet --version)
        echo "dotnet --version: $actual"
        case "$actual" in
          "$want".*) ;;
          *) echo "::error::Expected .NET SDK $want.x but dotnet resolved $actual"; exit 1 ;;
        esac

    - name: Restore dependencies
      run: dotnet restore

    - name: Build for analysis
      run: dotnet build --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Pin .NET SDK ${{ matrix.dotnet-version }}
      run: |
        want="${{ matrix.dotnet-version }}"
        want="${want%.x}"
        sdk=$(dotnet --list-sdks | awk -v p="$want." 'index($1, p) == 1 { print $1 }' | sort -V | tail -n 1)
        if [ -z "$sdk" ]; then
          echo "::error::No .NET SDK $want.x is installed"
          exit 1
        fi
        jq --arg v "$sdk" '.sdk = {version: $v, rollForward: "latestFeature"}' global.json > "$RUNNER_TEMP/global.json"
        mv "$RUNNER_TEMP/global.json" global.json
        cat global.json
        actual=$(dotnet --version)
        echo "dotnet --version: $actual"
        case "$actual" in
          "$want".*) ;;
          *) echo "::error::Expected .NET SDK $want.x but dotnet resolved $actual"; exit 1 ;;
        esac

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Performance Tests
      run: |
        echo "Creating large monorepo for performance testing..."
        export USE_DOTNET=true
        export TEST_DIR=/tmp/perf-test
        mkdir -p $TEST_DIR/large-monorepo
        cd $TEST_DIR/large-monorepo

        # Initialize git
        git init
        git config user.email "test@example.com"
        git config user.name "Test User"

        # Target framework of the generated projects, matching this leg's SDK (10.0.x -> net10.0)
        DOTNET_VERSION="${{ matrix.dotnet-version }}"
        TARGET_FX="net${DOTNET_VERSION%.x}"

        # The CLI itself targets net8.0, whatever SDK built it
        TOOL_PATH="$GITHUB_WORKSPACE/Mister.Version.CLI/bin/Release/net8.0/mr-version.dll"

        # Create 50 projects to test performance
        for i in {1..50}; do
          mkdir -p "src/Project$i"
          cat > "src/Project$i/Project$i.csproj" << EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>${TARGET_FX}</TargetFramework>
          </PropertyGroup>
        </Project>
        EOF
          echo "namespace Project$i { public class Class$i { } }" > "src/Project$i/Class$i.cs"
        done

        git add .
        git commit -m "Initial large monorepo"
        git tag v1.0.0

        # Test version calculation performance
        echo "Testing performance with 50 projects..."
        time dotnet "$TOOL_PATH" report --repo . --include-dependencies

        # Also test dependency graph generation performance
        echo "Testing dependency graph generation..."
        time dotnet "$TOOL_PATH" report --repo . -o graph --graph-format mermaid > /dev/null

  comprehensive-report:
    name: Generate Comprehensive Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-test]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Generate comprehensive test report
      run: |
        echo "# Comprehensive Test Report" > test-report.md
        echo "" >> test-report.md
        echo "## Summary" >> test-report.md
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> test-report.md
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> test-report.md
        echo "- **Performance Tests**: ${{ needs.performance-test.result }}" >> test-report.md
        echo "" >> test-report.md
        echo "## Detailed Results" >> test-report.md
        echo "See individual job artifacts for detailed test results." >> test-report.md

    - name: Upload comprehensive report
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-test-report
        path: test-report.md
