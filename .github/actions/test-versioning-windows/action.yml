name: 'Test Versioning Scenarios - Windows'
description: 'Run versioning tests on Windows with mock git repositories'
inputs:
  working-directory:
    description: 'Working directory for the tests'
    required: false
    default: '.'

# Every scenario step fails when one of its assertions fails (Invoke-TestScenario returns $false and
# the step exits 1). Scenario steps keep running after an earlier scenario failed (as long as the CLI
# was built), so one run reports every failure; "Test Summary" then fails the job if anything failed
# or if no result was recorded at all.

runs:
  using: 'composite'
  steps:
    - name: Setup Test Environment
      id: setup
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        Write-Host "Setting up test environment..."
        # Create a unique test directory in runner temp
        $timestamp = Get-Date -Format "yyyyMMddHHmmss"
        $env:TEST_DIR = Join-Path "${{ runner.temp }}" "mister-version-tests-$timestamp"
        "TEST_DIR=$env:TEST_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "test-dir=$env:TEST_DIR" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        # Export RUNNER_TEMP for test functions
        $env:RUNNER_TEMP = "${{ runner.temp }}"
        "RUNNER_TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        # Clean up any previous test runs
        if (Test-Path $env:TEST_DIR) {
          Remove-Item -Path $env:TEST_DIR -Recurse -Force
        }
        New-Item -ItemType Directory -Path $env:TEST_DIR -Force | Out-Null

        # Ensure test results file exists
        New-Item -ItemType File -Path (Join-Path $env:RUNNER_TEMP "test-results.txt") -Force | Out-Null

        Write-Host "Test directory: $env:TEST_DIR"

    - name: Build CLI Tool
      id: build-cli
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        Write-Host "Building Mister.Version CLI tool..."
        dotnet build .\Mister.Version.CLI\Mister.Version.CLI.csproj -c Debug
        if ($LASTEXITCODE -ne 0) {
          Write-Error "dotnet build failed with exit code $LASTEXITCODE"
          exit 1
        }

        # Set tool path (make it absolute)
        $workDir = (Get-Location).Path
        $toolPath = Join-Path $workDir "Mister.Version.CLI\bin\Debug\net8.0\mr-version.exe"
        if (-not (Test-Path $toolPath)) {
          $toolPath = Join-Path $workDir "Mister.Version.CLI\bin\Debug\net8.0\mr-version"
        }

        # Verify tool exists
        if (-not (Test-Path $toolPath)) {
          Write-Error "CLI tool not found at $toolPath"
          exit 1
        }
        Write-Host "Tool found at: $toolPath"
        "TOOL_PATH=$toolPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Test - Initial Repository (No Tags)
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-InitialRepo)) { exit 1 }

    - name: Test - Single Release Tag
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-SingleReleaseTag)) { exit 1 }

    - name: Test - Feature Branch Versioning
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-FeatureBranch)) { exit 1 }

    - name: Test - Release Branch Versioning
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-ReleaseBranch)) { exit 1 }

    - name: Test - Monorepo Multiple Projects
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-Monorepo)) { exit 1 }

    - name: Test - Monorepo With Dependencies
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-MonorepoWithDependencies)) { exit 1 }

    - name: Test - Pre-release Versions
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-PrereleaseVersions)) { exit 1 }

    - name: Test - Dev Branch Versioning
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-DevBranch)) { exit 1 }

    - name: Test - Build Metadata
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-BuildMetadata)) { exit 1 }

    - name: Test - Configuration Alpha
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-ConfigAlpha)) { exit 1 }

    - name: Test - Configuration Beta
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-ConfigBeta)) { exit 1 }

    - name: Test - Configuration RC
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-ConfigRC)) { exit 1 }

    - name: Test - YAML Configuration
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-YamlConfig)) { exit 1 }

    - name: Test - Force Version
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-ForceVersion)) { exit 1 }

    - name: Test - Tag Prefix Variations
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-TagPrefix)) { exit 1 }

    - name: Test - Dependency Tracking
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-DependencyTracking)) { exit 1 }

    - name: Test - Detached HEAD
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-DetachedHead)) { exit 1 }

    - name: Test - Path Handling
      if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        if (-not (Invoke-TestScenario Test-CrossPlatformPaths)) { exit 1 }

    - name: Generate Test Report
      if: always()
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        "## Test Results Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

        $resultsFile = Join-Path "${{ runner.temp }}" "test-results.txt"
        if (Test-Path $resultsFile) {
          Get-Content $resultsFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        } else {
          "No test results found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        }

    # Fails the job when any scenario recorded a failure (or when nothing ran at all)
    - name: Test Summary
      if: always()
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        . .github\actions\test-versioning-windows\test-functions.ps1
        Export-TestSummary

    - name: Upload Test Artifacts
      if: failure() && steps.setup.outputs.test-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: windows-test-repos
        path: ${{ steps.setup.outputs.test-dir }}
